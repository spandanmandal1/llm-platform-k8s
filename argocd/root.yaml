# App of apps: Argo CD deploys everything in argocd/apps from this repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source: {repoURL: https://github.com/spandanmandal1/llm-platform-k8s.git, targetRevision: main, path: argocd/apps}
  destination: {server: https://kubernetes.default.svc, namespace: argocd}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
