{{- if .Values.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "llama.fullname" . }}
  labels: {{- include "llama.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "llama.fullname" . }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  pollingInterval: {{ .Values.autoscaling.pollingInterval }}
  cooldownPeriod: {{ .Values.autoscaling.cooldownPeriod }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.autoscaling.prometheusAddress }}
        # requests in a slot + requests waiting for one, across all replicas
        query: |
          sum(llamacpp:requests_processing{namespace="{{ .Release.Namespace }}"})
          + sum(llamacpp:requests_deferred{namespace="{{ .Release.Namespace }}"})
        threshold: {{ .Values.autoscaling.threshold | quote }}
{{- end }}
