apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llama.fullname" . }}
  labels: {{- include "llama.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.autoscaling.minReplicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "llama.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "llama.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: llama-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # llama.cpp wants "--flag value" as two arguments; "--flag=value" is rejected
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --model
            - /models/{{ .Values.model.file }}
            - --alias
            - {{ .Values.model.alias }}
            - --threads
            - {{ .Values.server.threads | quote }}
            - --parallel
            - {{ .Values.server.parallel | quote }}
            - --ctx-size
            - {{ .Values.server.ctxSize | quote }}
            - --metrics
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: models
          hostPath:
            path: {{ .Values.model.hostDir }}
            type: Directory
        - name: tmp
          emptyDir: {}
